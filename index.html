<style>
:root{
  --bg:#0e1411; --card:#161f1a; --card2:#1c2721; --line:#26342c; --txt:#e9f0eb; --mut:#8c9e94;
  --gold:#e8b84a; --green:#46d08a; --red:#ff6f6f; --amber:#f2a541; --blue:#6fb4ff;
  --r:16px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{padding:calc(10px + var(--st)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.logo{font:700 22px 'Space Grotesk',sans-serif;letter-spacing:-.5px}
.logo b{color:var(--gold)}
.logoimg{width:32px;height:32px;image-rendering:pixelated;flex:none}
.hero{display:block;width:120px;height:120px;image-rendering:pixelated;margin:6px auto 4px;filter:drop-shadow(0 6px 16px #e8b84a40)}
.heroname{font:700 30px 'Space Grotesk',system-ui,sans-serif;text-align:center;letter-spacing:-.5px;margin-bottom:10px}.heroname b{color:var(--gold)}
.ver{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.sync{margin-left:auto;font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.ok{background:var(--green)} .dot.loc{background:var(--amber)}
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:14px 14px 24px;display:none}
.view.on{display:block}
#v-chat.on{display:flex;flex-direction:column;padding:0}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:var(--sb)}
nav button{flex:1;padding:9px 0 8px;font-size:10.5px;min-width:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:19px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--gold)} nav button.on i{filter:none;opacity:1}
/* chat */
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:86%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.m.me{align-self:flex-end;background:#24402f;border-bottom-right-radius:4px}
.m.reis{align-self:flex-start;background:var(--card2);border-bottom-left-radius:4px}
.m.reis .who{font:700 12px 'Space Grotesk',system-ui,sans-serif;color:var(--gold);display:block;margin-bottom:2px}
.m small{color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--mut);background:var(--card)}
.inbar{display:flex;gap:8px;padding:10px 12px 12px;align-items:center}
.inbar input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:11px 16px;outline:none;min-width:0}
.inbar input:focus{border-color:var(--gold)}
.rb{width:44px;height:44px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:18px;flex:none;display:grid;place-items:center}
.rb.send{background:var(--gold);color:#1b1406;border:0;font-weight:700}
.rb.live{background:var(--red);border-color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{font:700 14px 'Space Grotesk',system-ui,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav button{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px}
.mnav span{font:700 17px 'Space Grotesk',system-ui,sans-serif;text-transform:capitalize}
.big{font:700 32px 'Space Grotesk',system-ui,sans-serif;letter-spacing:-1px}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--mut)} .gold{color:var(--gold)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.trio div{background:var(--card2);border-radius:12px;padding:8px 10px}
.trio small{display:block;color:var(--mut);font-size:11px}
.trio b{font-size:14px}
.bar{margin:9px 0}
.bar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.track{height:9px;background:var(--card2);border-radius:99px;position:relative;overflow:visible}
.fill{height:100%;border-radius:99px;background:var(--green)}
.fill.warn{background:var(--amber)} .fill.bad{background:var(--red)}
.ref{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--txt);opacity:.55;border-radius:2px}
.ins{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ins:first-of-type{border-top:0}
.ins i{font-style:normal}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ic{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{color:var(--mut);font-size:12px}
.row .val{font-weight:700;white-space:nowrap}
.x{color:var(--mut);font-size:16px;padding:4px 6px}
.day{font-size:12px;color:var(--mut);margin:14px 0 2px;text-transform:capitalize}
.btn{background:var(--gold);color:#1b1406;font-weight:700;border-radius:12px;padding:10px 14px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:600}
.btn.dan{background:transparent;color:var(--red);border:1px solid #5a2a2a}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:12px;color:var(--mut)}
.f input,.f select,.f textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:7px;border-radius:8px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--card);color:var(--txt)}
.tag{font-size:11px;border-radius:99px;padding:2px 8px;font-weight:600}
.tag.ok{background:#1d3a2a;color:var(--green)} .tag.wa{background:#3d2f17;color:var(--amber)} .tag.ba{background:#3d1d1d;color:var(--red)}
.rate{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rate:first-of-type{border-top:0}
.empty{color:var(--mut);text-align:center;padding:24px 8px;font-size:14px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px;line-height:1.6}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}
.sheet{background:var(--card);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:560px;padding:18px 16px calc(18px + var(--sb));max-height:85vh;overflow-y:auto}
.sheet h4{font:700 17px 'Space Grotesk',system-ui,sans-serif;margin-bottom:8px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
.toast.on{opacity:1}
.av{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px;margin-right:5px}
.coinload{width:16px;height:16px;image-rendering:pixelated;display:none}
.toast img{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px;margin-right:6px}
.cc{border-radius:18px;padding:16px 18px;color:#fff;margin:4px 0 10px;box-shadow:0 10px 26px #0007;position:relative;overflow:hidden}
.cc::after{content:'';position:absolute;right:-50px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:#ffffff14;pointer-events:none}
.cc::before{content:'';position:absolute;right:40px;bottom:-90px;width:160px;height:160px;border-radius:50%;background:#ffffff0d;pointer-events:none}
.wk{border-top:1px solid var(--line)}.wk:first-child{border-top:0}
.wk>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;cursor:pointer;list-style:none}
.wk>summary::-webkit-details-marker{display:none}
.wk>summary::after{content:'›';color:var(--mut);font-size:20px;transition:.2s;margin-left:4px}
.wk[open]>summary::after{transform:rotate(90deg)}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:19}
.rain img{position:absolute;top:-60px;image-rendering:pixelated;animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes fall{to{transform:translateY(calc(100vh + 80px))}}
.m.reis .btn{white-space:normal}
.reward{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#0e1411e6 0,#0e141100 60%);animation:coinTxt 1.6s ease forwards;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:20}
.reward img{width:112px;height:112px;image-rendering:pixelated;filter:drop-shadow(0 6px 18px #e8b84a66);animation:coinUp 1.6s cubic-bezier(.2,.8,.2,1) forwards}
.reward b{font:700 24px 'Space Grotesk',system-ui,sans-serif;color:var(--gold);text-shadow:0 2px 10px #000;margin-top:8px;animation:coinTxt 1.6s ease forwards;text-align:center;padding:0 20px}
.reward.big img{width:150px;height:150px}
.reward.big b{font-size:28px}
@keyframes coinUp{0%{transform:translateY(60px) scale(.4);opacity:0}18%{transform:translateY(0) scale(1.1);opacity:1}30%{transform:scale(1)}75%{transform:translateY(-20px);opacity:1}100%{transform:translateY(-90px);opacity:0}}
@keyframes coinTxt{0%,15%{opacity:0;transform:translateY(10px)}30%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
@media (prefers-reduced-motion:reduce){.reward img,.reward b{animation:none}}
details summary{cursor:pointer;color:var(--gold);font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
</style>
</head>

  const prep=String(text||'').replace(/(\d)(k\b|mil\b|reais\b|real\b|conto|pila|pratas?)/gi,'$1 $2').replace(/r\$\s*/gi,'r$ ');
  const orig=prep.toLowerCase().split(/\s+/).map(t=>t.replace(/^[,.\-]+|[,.!?;:]+$/g,'')).filter(Boolean);
  return {orig,n:orig.map(t=>norm(t).replace(/[,.]$/,''))};
}
function parseNumTok(t){
  if(t==null)return null;
  const m=String(t).match(/^(?:r\$)?(\d[\d.,]*)(k)?$/);if(!m)return null;
  let s=m[1].replace(/[.,]$/,'');
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/\.\d{3}(\.|$)/.test(s))s=s.replace(/\./g,'');
  let v=parseFloat(s);if(isNaN(v))return null;if(m[2])v*=1000;return v;
}
function centsAfter(n,j,used){ // "5 e 50" / "cinco conto e cinquenta"
  if(n[j]!=='e')return 0;
  let c=parseNumTok(n[j+1]);if(c==null&&NUMW[n[j+1]]!=null)c=NUMW[n[j+1]];
  if(c!=null&&Number.isInteger(c)&&c<100&&(c>=10||n[j+2]==='centavos')&&!(n[j+2]&&UNIT.has(n[j+2]))){
    used.add(j);used.add(j+1);if(n[j+2]==='centavos')used.add(j+2);return c/100;}
  return 0;
}
function extractAmount(n){
  // 1) números escritos com dígitos
  for(let i=0;i<n.length;i++){
    if(n[i-1]==='dia'||n[i-1]==='meta')continue;
    let v=parseNumTok(n[i]);if(v==null)continue;
    const used=new Set([i]);let j=i+1;
    if(n[j]==='k'||n[j]==='mil'){v*=1000;used.add(j);j++;}
    if(n[j]==='%')continue;
    if(UNIT.has(n[j])){used.add(j);j++;}
    v+=centsAfter(n,j,used);
    return {v:Math.round(v*100)/100,used};
  }
  // 2) gírias: cincão, dezinho, vintão...
  for(let i=0;i<n.length;i++){
    if(SLANG[n[i]]!=null){const used=new Set([i]);let j=i+1;if(UNIT.has(n[j])){used.add(j);j++;}
      let v=SLANG[n[i]]+centsAfter(n,j,used);return {v,used};}
  }
  // 3) números por extenso: "cinco conto", "vinte e cinco", "cinco e cinquenta"
  for(let i=0;i<n.length;i++){
    if((NUMW[n[i]]==null&&!(n[i]==='mil'&&NUMW[n[i-1]]==null))||n[i-1]==='dia')continue;
    const used=new Set();let j=i,total=0,cur=0,cents=0,afterE=false,hasMil=false;
    while(j<n.length){
      const t=n[j];
      if(NUMW[t]!=null){const val=NUMW[t];
        if(afterE&&cur>0&&cur<100&&val>=10&&val<100&&(cur<10||cur%10!==0)){cents=val;used.add(j);j++;break;}
        cur+=val;used.add(j);j++;afterE=false;}
      else if(t==='mil'){cur=(cur||1)*1000;total+=cur;cur=0;used.add(j);j++;hasMil=true;afterE=false;}
      else if(t==='e'&&NUMW[n[j+1]]!=null){afterE=true;used.add(j);j++;}
      else break;
    }
    let v=total+cur+cents/100;let hasUnit=false;
    if(UNIT.has(n[j])){hasUnit=true;used.add(j);j++;v+=centsAfter(n,j,used);}
    const nxt=n[j];
    const ok=hasUnit||hasMil||(v>1&&(nxt===undefined||['de','em','no','na','pra','para','com','reais'].includes(nxt)));
    if(ok&&v>0)return {v:Math.round(v*100)/100,used};
  }
  return null;
}
function hasWord(ntext,w){return new RegExp('(^| )'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(s|es)?( |$)').test(ntext);}
function findCat(ntext,learned){
  for(const w in (learned||{}))if(hasWord(ntext,w))return {cat:learned[w],kw:w};
  const m=ntext.match(/\b(?:em|de|com|categoria)\s+(comida fora|comida|mercado|casa|contas|transporte|saude|lazer|compras|assinaturas?|educacao|pets?|outros)\b/);
  if(m)return {cat:CATNAME[m[1]],kw:null,explicit:true};
  for(const [w,c] of KWLIST)if(hasWord(ntext,w))return {cat:c,kw:w};
  return {cat:'outros',kw:null,unknown:true};
}
function incCat(ntext){
  if(/salario|holerite|pagamento|adiantamento|vale\b|dia do pagamento/.test(ntext))return 'salario';
  if(/bico|freela|freelance|extra|vendi|venda|comissao|hora extra|servico/.test(ntext))return 'extra';
  return 'outra';
}
const INCOME_RE=/\b(recebi|ganhei|recebeu|ganhou|recebemos|entrou|entrada|caiu|salario|bico|freela|freelance|renda|reembolso|vendi|me pagaram|pagaram|pix recebido|adiantamento|comissao)\b/;
function buildDesc(orig,n,used,kw){
  const keep=new Set();
  for(let i=0;i<orig.length;i++){
    if(used.has(i))continue;const t=n[i];
    if(FILLER.has(t)||UNIT.has(t)||NUMW[t]!=null||SLANG[t]!=null||parseNumTok(t)!=null||t==='centavos'||t==='mil'||t==='k')continue;
    if(CATNAME[t]&&!kw)continue;
    keep.add(i);
  }
  for(let i=1;i<orig.length-1;i++)if(['de','do','da'].includes(n[i])&&keep.has(i-1)&&keep.has(i+1))keep.add(i);
  const kept=[...keep].sort((a,b)=>a-b).map(i=>orig[i]);
  let d=kept.slice(0,6).join(' ').replace(/[,.]+$/,'');
  if(!d&&kw)d=kw;
  return d?d.charAt(0).toUpperCase()+d.slice(1):'';
}
/* Interpreta uma frase como lançamento. Retorna null se não houver valor. */
function parseEntry(text,learned){
  const {orig,n}=tokens(text);const ntext=n.join(' ');
  const amt=extractAmount(n);if(!amt)return null;
  const isInc=INCOME_RE.test(ntext);
  let dayOff=0;if(/\banteontem\b/.test(ntext))dayOff=-2;else if(/\bontem\b/.test(ntext))dayOff=-1;
  if(isInc){const cat=incCat(ntext);return {t:'e',v:amt.v,cat,desc:buildDesc(orig,n,amt.used,null)||INC[cat].n,dayOff};}
  const fc=findCat(ntext,learned);
  return {t:'s',v:amt.v,cat:fc.cat,desc:buildDesc(orig,n,amt.used,fc.kw)||CATS[fc.cat].n,dayOff,unknown:!!fc.unknown};
}

/* ======================= ESTADO & ARMAZENAMENTO ======================= */
const LS='mereis_alpha';
const pad=n=>String(n).padStart(2,'0');
const mk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mLabel=k=>{const [y,m]=k.split('-');return MESES[+m-1]+' '+y};
const shiftKey=(k,d)=>{const [y,m]=k.split('-').map(Number);return mk(new Date(y,m-1+d,1));};
const dim=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate();};

function blank(){return {v:1,cfg:{meta:10,usd:null,btc:null,ratesAt:null,ratesSrc:'',learned:{},bills:[],boxes:[],goals:[],cards:[],cardPaid:{},accts:[],acctMoves:[],defAcct:null,salary:{},couple:false,people:[{id:'p1',name:'Eu'},{id:'p2',name:'Parceiro(a)'}],selic:13.75,cdi:13.65,tr:0.15,bcAt:Date.UTC(2026,10,18,12),bcSrc:'ref',upd:0},months:{},chat:[]};}
let S=blank();
try{const raw=localStorage.getItem(LS);if(raw){const p=JSON.parse(raw);if(p&&p.cfg&&p.months){S=Object.assign(blank(),p);S.cfg=Object.assign(blank().cfg,p.cfg);}}}catch(e){}
let viewMonth=mk(new Date());

const dirty=new Set();let db=null,col=null,syncTimer=null,syncing=false,cloud=false;
function month(k){return S.months[k]||(S.months[k]={entries:[],paid:{},upd:0});}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function touchMonth(k){month(k).upd=Date.now();dirty.add('m-'+k);persist();}
function touchCfg(){S.cfg.upd=Date.now();dirty.add('config');persist();}
function persist(){saveLocal();clearTimeout(syncTimer);syncTimer=setTimeout(flush,1200);}
async function flush(){
  if(!col||syncing||!dirty.size)return;syncing=true;
  try{
    for(const key of [...dirty]){
      dirty.delete(key);
      const body=key==='config'?{upd:S.cfg.upd,cfg:S.cfg}:(()=>{const m=month(key.slice(2));return {upd:m.upd,entries:m.entries,paid:m.paid};})();
      try{await col.doc(key).set(JSON.parse(JSON.stringify(body)));}
      catch(e){dirty.add(key);if(e&&e.code==='quota_exceeded')toast('Espaço da nuvem cheio — dados seguem salvos no aparelho');break;}
    }
  }finally{syncing=false;setSync();if(dirty.size)syncTimer=setTimeout(flush,4000);}
}
let LOADING=0;
function busy(on){LOADING=Math.max(0,LOADING+(on?1:-1));setSync();}
function setSync(){
  const d=document.getElementById('syncDot'),t=document.getElementById('syncTxt'),cn=document.getElementById('syncCoin');
  const spin=LOADING>0||(cloud&&dirty.size>0)||syncing;cn.style.display=spin?'inline-block':'none';d.style.display=spin?'none':'';
  if(LOADING>0&&!syncing&&!dirty.size){t.textContent='carregando…';return;}
  if(cloud){d.className='dot ok';t.textContent=dirty.size?'salvando…':'salvo na conta';}
  else{d.className='dot loc';t.textContent='salvo no aparelho';}
}
async function initCloud(){
  if(!window.claude||typeof claude.use!=='function'){setSync();return;}
  busy(true);
  try{
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!d||!u){setSync();return;}
    const id=await u.id();if(!id){setSync();return;}
    db=d;col=db.collection('data/users/'+id);
    const snap=await Promise.race([col.get(),new Promise((_,r)=>setTimeout(()=>r('timeout'),10000))]);
    const seen=new Set();
    snap.docs.forEach(doc=>{
      if(!doc.exists)return;const data=doc.data()||{};seen.add(doc.id);
      if(doc.id==='config'){if((data.upd||0)>(S.cfg.upd||0))S.cfg=Object.assign(blank().cfg,JSON.parse(JSON.stringify(data.cfg||{})));else if((S.cfg.upd||0)>(data.upd||0))dirty.add('config');}
      else if(doc.id.startsWith('m-')){const k=doc.id.slice(2),loc=S.months[k];
        if(!loc||(data.upd||0)>(loc.upd||0))S.months[k]={entries:JSON.parse(JSON.stringify(data.entries||[])),paid:Object.assign({},data.paid||{}),upd:data.upd||0};
        else if((loc.upd||0)>(data.upd||0))dirty.add(doc.id);}
    });
    if(!seen.has('config')&&S.cfg.upd)dirty.add('config');
    for(const k in S.months)if(!seen.has('m-'+k)&&S.months[k].entries.length)dirty.add('m-'+k);
    cloud=true;saveLocal();renderAll();flush();
  }catch(e){}
  busy(false);
}

function addEntry(e){
  const d=new Date();if(e.dayOff)d.setDate(d.getDate()+e.dayOff);
  if(e.date){const [y,m,dd]=e.date.split('-').map(Number);d.setFullYear(y,m-1,dd);}
  const k=mk(d);const en={id:uid(),t:e.t,v:Math.round(e.v*100)/100,cat:e.cat,desc:e.desc||'',ts:d.getTime(),src:e.src||'chat'};
  ['bill','box','lot','prevLots','goal'].forEach(f=>{if(e[f]!=null)en[f]=e[f];});
  if(S.cfg.couple)en.who=e.who||ACTIVE;
  {const ac=e.acct||(e.noAcct?null:S.cfg.defAcct);if(ac&&!en.card)en.acct=ac;}
  month(k).entries.push(en);touchMonth(k);S.lastAdd={k,id:en.id};return en;
}
function removeEntry(k,id){
  const m=month(k);const en=m.entries.find(x=>x.id===id);if(!en)return null;
  m.entries=m.entries.filter(x=>x.id!==id);
  if(en.bill&&m.paid[en.bill]===id)delete m.paid[en.bill];
  if(en.t==='g'&&en.goal){const g=S.cfg.goals.find(x=>x.id===en.goal);if(g){g.saved=Math.round((g.saved-en.v)*100)/100;touchCfg();}}
  if(en.t==='g'&&en.box){const b=S.cfg.boxes.find(x=>x.id===en.box);
    if(b){if(en.prevLots)b.lots=JSON.parse(JSON.stringify(en.prevLots));else if(en.lot)b.lots=b.lots.filter(l=>l.id!==en.lot);touchCfg();}}
  touchMonth(k);if(en.buy)removeBuy(en.buy);return en;
}
function payBill(b,valor){
  const k=mk(new Date());const m=month(k);if(m.paid[b.id])return null;
  const en=addEntry({t:'s',v:valor||b.v,cat:b.cat||'casa',desc:b.name,src:'conta',bill:b.id});
  m.paid[b.id]=en.id;touchMonth(k);return en;
}

/* ======================= CÁLCULOS ======================= */
function stats(k){
  const m=month(k);let inc=0,out=0,guard=0;const by={};
  m.entries.forEach(e=>{if(e.t==='e')inc+=e.v;else if(e.t==='g')guard+=e.v;else{out+=e.v;by[e.cat]=(by[e.cat]||0)+e.v;}});
  const cur=mk(new Date());
  const pend=(k>=cur)?S.cfg.bills.filter(b=>!m.paid[b.id]).reduce((s,b)=>s+b.v,0):0;
  const metaV=inc*(S.cfg.meta||0)/100;
  const livre=inc-out-guard-pend-Math.max(0,metaV-guard);
  let daysLeft=0;if(k===cur)daysLeft=dim(k)-new Date().getDate()+1;else if(k>cur)daysLeft=dim(k);
  return {inc,out,guard,by,pend,metaV,livre,daysLeft,saldo:inc-out-guard,n:m.entries.length};
}
function spentUntil(k,day){return month(k).entries.filter(e=>e.t==='s'&&new Date(e.ts).getDate()<=day).reduce((s,e)=>s+e.v,0);}
function insights(k){
  const s=stats(k),out=[];const cur=mk(new Date());
  if(!s.n){return [{i:'👋',t:'Ainda não tem lançamentos neste mês. Fala com o Reis: "cincão de salgado" ou "recebi 2000 de salário".'}];}
  if(!s.inc)out.push({i:'💡',t:'Registre suas entradas (ex.: "recebi 2000 de salário") pra eu calcular o peso real de cada gasto na sua renda.'});
  if(s.inc){
    const over=[];
    for(const c in s.by){const pct=s.by[c]/s.inc*100,ref=CATS[c]?.ref||5;
      if(pct>ref)over.push({c,pct,ref,cut:s.by[c]-s.inc*ref/100});}
    over.sort((a,b)=>b.cut-a.cut).slice(0,3).forEach(o=>out.push({i:'⚠️',t:`${CATS[o.c].e} ${CATS[o.c].n} está em ${o.pct.toFixed(0)}% da renda (referência: até ${o.ref}%). Cortar ${brl(o.cut)} te coloca dentro.`}));
  }
  const small=month(k).entries.filter(e=>e.t==='s'&&e.v<20&&e.src!=='conta');
  if(small.length>=5){const tot=small.reduce((a,e)=>a+e.v,0);
    out.push({i:'🐜',t:`Gastos formiguinha: ${small.length} lançamentos abaixo de R$ 20 somaram ${brl(tot)}. Pouco a pouco pesa — dá pra cortar metade?`});}
  if(s.inc&&s.guard>=s.metaV&&s.metaV>0)out.push({i:'🏆',t:`Meta do mês batida: você já guardou ${brl(s.guard)}!`});
  if(s.inc&&s.livre<0)out.push({i:'🎯',t:`Do jeito que está, faltam ${brl(-s.livre)} pra fechar o mês e ainda guardar ${S.cfg.meta}% (${brl(s.metaV)}).`});
  else if(s.inc&&s.daysLeft)out.push({i:'✅',t:`Dá pra gastar até ${brl(s.livre/s.daysLeft)} por dia nos próximos ${s.daysLeft} dias e ainda guardar ${brl(s.metaV)}.`});
  if(k===cur){const today=new Date().getDate();
    S.cfg.bills.filter(b=>!month(k).paid[b.id]).forEach(b=>{const dd=b.dia-today;
      if(dd<0)out.push({i:'🔴',t:`${b.name} venceu dia ${b.dia} (${brl(b.v)}) e ainda não foi marcada como paga.`});
      else if(dd<=3)out.push({i:'📅',t:`${b.name} vence ${dd===0?'hoje':dd===1?'amanhã':'em '+dd+' dias'} — ${brl(b.v)}.`});});
    const prev=shiftKey(k,-1);if(month(prev).entries.length){const a=spentUntil(k,today),b=spentUntil(prev,today);
      if(b>0){const diff=(a-b)/b*100;if(Math.abs(diff)>=10)out.push({i:diff>0?'📈':'📉',t:`Até hoje você gastou ${Math.abs(diff).toFixed(0)}% ${diff>0?'a mais':'a menos'} que no mesmo ponto de ${MESES[+prev.split('-')[1]-1]}.`});}}
  }
  if(k===mk(new Date())){cardInsights(out);(S.cfg.accts||[]).forEach(a=>{const b=acctBalance(a);if(b<0)out.unshift({i:'🏦',t:`${a.name} está em ${brl(b)} (cheque especial). Juros cobrados por dia: cobrir isso rende mais que qualquer investimento. Prioridade antes das metas.`});});}
  if(!out.length)out.push({i:'👌',t:'Tudo dentro das referências. Segue assim!'});
  return out;
}

  if(m){const v=parseNumTok(m[2]);if(v){if(m[1]==='dolar'||m[1]==='usd')S.cfg.usd=v;else S.cfg.btc=v;S.cfg.ratesAt=Date.now();S.cfg.ratesSrc='manual';touchCfg();
    return `Anotado: ${m[1].startsWith('b')?'Bitcoin':'Dólar'} a ${brl(v)} (manual).`;}}
  if(/(cotacao|cotacoes|quanto (ta|esta) o (dolar|bitcoin|btc)|dolar hoje|preco do (dolar|bitcoin))/.test(n)){
    fetchRates(true);return ratesText()+'\n<small>Tentando atualizar online…</small>';}

  if(m){S.cfg.meta=Math.min(90,+m[1]);touchCfg();const s=stats(k);
    return `Meta ajustada: guardar ${S.cfg.meta}% da renda${s.inc?` (${brl(s.metaV)} este mês)`:''}. 🎯`;}
  {const nr=nameReply(raw,n);if(nr)return nr;}

  {const sr=salaryReceiptReply(raw,n);if(sr)return sr;}
  {const cr=cardReply(raw,n);if(cr)return cr;}
  // conta fixa
  if(/conta fixa|vence dia|todo dia \d|^conta (de|da|do) .*dia \d/.test(n)){
    const {orig,n:nt}=tokens(raw);const amt=extractAmount(nt);const dm=n.match(/dia (\d{1,2})/);

Entrou ${brl(s.inc)} · Saiu ${brl(s.out)}${s.guard?` · Guardou ${brl(s.guard)}`:''}

${s.inc?`Sobra depois da meta de ${S.cfg.meta}%: <b>${brl(s.livre)}</b>`:'Registre suas entradas pra eu calcular quanto sobra.'}`+((S.cfg.accts||[]).length?'\n\n'+acctSummary():'');}

  }
  // lançamento
  const dw=detectWho(n);let rawE=raw;if(dw.strip)rawE=raw.split(/\s+/).filter(w=>norm(w).replace(/[,.!?]/g,'')!==dw.strip).join(' ');
  const acM=findAcct(n);if(acM){const aw=norm(acM.name).split(' ');rawE=rawE.split(/\s+/).filter(w=>!aw.includes(norm(w).replace(/[,.!?]/g,''))).join(' ');}
  const p=parseEntry(rawE,S.cfg.learned);if(p&&dw.who)p.who=dw.who;if(p&&acM)p.acct=acM.id;

  const en=addEntry(p);

  if(p.t==='e'&&en.cat==='salario'&&!p.dayOff)return triggerPayday(en);
  if(p.t==='e'){const s=stats(mk(new Date(en.ts)));return `💰 Entrada de <b>${brl(en.v)}</b> em ${INC[en.cat].n}${when}. Saldo do mês: ${brl(s.saldo)}.`;}

  let r=`Anotado! 💸 <b>${brl(en.v)}</b> em ${CATS[en.cat].e} ${CATS[en.cat].n} — ${esc(en.desc)}${when}.`;
  if(!when)r+=`\nHoje: ${brl(todayOut())}`+(cardTodayTotal()?` (+ ${brl(cardTodayTotal())} no cartão)`:'')+(s.inc&&s.daysLeft?(s.livre>=0?` · Pode gastar ${brl(s.livre/s.daysLeft)}/dia`:` · ⚠️ ${brl(-s.livre)} acima do limite da meta`):'');
  if(p.unknown)r+=`\n<small>Não sei a categoria disso. Me ensina: "${esc((en.desc||'isso').toLowerCase())} é comida" (ou mercado, lazer…). Ou toque no lançamento na aba 🧾.</small>`;
  return r;
}

const DAY=86400000;
function bizDays(a,b){let n=0;const d=new Date(a);d.setHours(12,0,0,0);const end=new Date(b);end.setHours(12,0,0,0);
  while(d<end){d.setDate(d.getDate()+1);const w=d.getDay();if(w&&w<6)n++;}return n;}
function fullMonths(a,b){const x=new Date(a),y=new Date(b);let m=(y.getFullYear()-x.getFullYear())*12+y.getMonth()-x.getMonth();if(y.getDate()<x.getDate())m--;return Math.max(0,m);}
function lotCalc(lot,box,when){
  const c=S.cfg;const now=when||Date.now();
  if(box.kind==='poup'){const g=lot.v*Math.pow(1+0.005+(c.tr||0)/100,fullMonths(lot.d,now));return {g,n:g,ir:0};}
  const bd=bizDays(lot.d,now);
  let g;
  if(box.kind==='pre')g=lot.v*Math.pow(1+box.pct/100,bd/252);
  else{const daily=(Math.pow(1+c.cdi/100,1/252)-1)*box.pct/100;g=lot.v*Math.pow(1+daily,bd);}
  let gain=g-lot.v;const dc=Math.floor((now-lot.d)/DAY);
  if(dc<30)gain*=1-IOF[Math.max(0,dc-1)]/100;
  const irPct=dc<=180?22.5:dc<=360?20:dc<=720?17.5:15;
  const ir=Math.max(0,gain)*irPct/100;
  return {g,n:lot.v+gain-ir,ir:irPct};
}
function boxCalc(box,when){let p=0,g=0,n=0;box.lots.forEach(l=>{const r=lotCalc(l,box,when);p+=l.v;g+=r.g;n+=r.n;});
  const yearRate=box.kind==='poup'?Math.pow(1+0.005+(S.cfg.tr||0)/100,12)-1:box.kind==='pre'?box.pct/100:Math.pow(1+(Math.pow(1+S.cfg.cdi/100,1/252)-1)*box.pct/100,252)-1;
  const mes=g*(Math.pow(1+yearRate,1/12)-1);
  const ano=box.lots.reduce((s,l)=>s+lotCalc(l,box,Date.now()+365*DAY).n,0);
  const poupAno=box.lots.reduce((s,l)=>s+lotCalc(l,{kind:'poup'},Date.now()+365*DAY).n,0);
  return {p,g,n,mes,ano,poupAno,yearRate};
}
function boxLabel(b){return b.kind==='poup'?'Poupança':b.kind==='pre'?b.pct.toLocaleString('pt-BR')+'% a.a.':b.pct.toLocaleString('pt-BR')+'% do CDI';}
function totalsGuard(){let p=0,n=0,mes=0;S.cfg.boxes.forEach(b=>{const r=boxCalc(b);p+=r.p;n+=r.n;mes+=r.mes;});return {p,n,mes};}
function boxAporte(box,v){const _b={guard:stats(mk(new Date())).guard};setTimeout(()=>afterSave(v,null,_b),0);const lot={id:uid(),d:Date.now(),v};box.lots.push(lot);touchCfg();
  return addEntry({t:'g',v,cat:'guardado',desc:box.name,box:box.id,lot:lot.id});}
function boxResgate(box,v){const prev=JSON.parse(JSON.stringify(box.lots));let A=v;
  box.lots.sort((a,b)=>a.d-b.d);const keep=[];
  for(const l of box.lots){if(A<=0){keep.push(l);continue;}const g=lotCalc(l,box).g;
    if(g<=A+0.005){A-=g;}else{l.v*= (g-A)/g;A=0;keep.push(l);}}
  box.lots=keep;touchCfg();
  return addEntry({t:'g',v:-(v-Math.max(0,A)),cat:'guardado',desc:box.name,box:box.id,prevLots:prev});}
function findBox(n){
  const bs=S.cfg.boxes;if(!bs.length)return null;
  let b=bs.find(b=>n.includes(norm(b.name)));if(b)return b;
  b=bs.filter(b=>n.includes(norm(b.bank||'')));if(b.length===1)return b[0];
  if(/poupanca/.test(n)){b=bs.filter(x=>x.kind==='poup');if(b.length===1)return b[0];}
  return bs.length===1?bs[0]:null;
}

function monthsLeft(dl){if(!dl)return null;const [y,m]=dl.split('-').map(Number);const d=new Date();return Math.max(1,(y*12+m)-(d.getFullYear()*12+d.getMonth()+1)+1);}

function goalNeed(g){const rest=Math.max(0,g.target-g.saved);const ml=monthsLeft(g.deadline);return ml?rest/ml:null;}
/* Plano do mês: divide a meta de poupança entre as metas, na ordem de prioridade */
function goalPlan(){
  const s=stats(mk(new Date()));const budget=s.inc?s.metaV:0;const open=S.cfg.goals.filter(g=>g.saved<g.target);
  const plan={};let rest=budget,needTot=0;
  open.forEach(g=>{const need=goalNeed(g);if(need!=null){needTot+=need;const a=Math.min(need,rest);plan[g.id]=a;rest-=a;}});
  const free=open.filter(g=>goalNeed(g)==null);
  if(free.length&&rest>0){const w=free.map((g,i)=>free.length-i);const ws=w.reduce((a,b)=>a+b,0);free.forEach((g,i)=>plan[g.id]=rest*w[i]/ws);rest=0;}
  return {plan,budget,needTot,short:Math.max(0,needTot-budget)};
}

function goalTirar(g,v,who){

function daysToPayday(){
  const pd=S.cfg.payday||new Date().getDate();const t=new Date();t.setHours(12,0,0,0);
  let nx=new Date(t.getFullYear(),t.getMonth()+1,Math.min(pd,28),12);
  if(pd>28){const last=new Date(t.getFullYear(),t.getMonth()+2,0).getDate();nx=new Date(t.getFullYear(),t.getMonth()+1,Math.min(pd,last),12);}

const r2=v=>Math.round(v*100)/100;
function paydayPlan(P,who,kind){
  const k=mk(new Date()),m=month(k);
  if(!S.cfg.payday){S.cfg.payday=new Date().getDate();touchCfg();}
  const pend=S.cfg.bills.filter(b=>!m.paid[b.id]).reduce((a,b)=>a+b.v,0);
  const contas=r2(Math.min(pend,P));
  const fat=r2(S.cfg.cards.reduce((a,cd)=>a+Math.max(0,fatTotal(cd.id,k)-fatPaid(cd.id,k)),0));
  const metaAmt=r2(P*(S.cfg.meta||0)/100);
  let rest=metaAmt;const alloc=[];
  const open=S.cfg.goals.filter(g=>g.saved<g.target);
  open.forEach(g=>{const need=goalNeed(g);if(need!=null&&rest>0.009){const a=r2(Math.min(need,rest,g.target-g.saved));if(a>0){alloc.push({goal:g.id,v:a});rest=r2(rest-a);}}});
  const free=open.filter(g=>goalNeed(g)==null);
  if(free.length&&rest>0.009){const w=free.map((g,i)=>free.length-i),ws=w.reduce((a,b)=>a+b,0);const base=rest;
    free.forEach((g,i)=>{const a=r2(Math.min(base*w[i]/ws,g.target-g.saved,rest));if(a>0){alloc.push({goal:g.id,v:a});rest=r2(rest-a);}});}
  if(rest>0.009)alloc.push({box:S.cfg.boxes[0]?S.cfg.boxes[0].id:null,v:rest});
  const cover=[];if(S.cfg.defAcct)(S.cfg.accts||[]).forEach(a=>{if(a.id===S.cfg.defAcct)return;const b=acctBalance(a);if(b<0)cover.push({acct:a.id,v:r2(-b)});});
  let coverT=r2(cover.reduce((x,c)=>x+c.v,0));const room=Math.max(0,r2(P-contas-fat));if(coverT>room){const f=room/coverT;cover.forEach(c=>c.v=r2(c.v*f));coverT=r2(cover.reduce((x,c)=>x+c.v,0));}
  const defNeg=S.cfg.defAcct&&acctById(S.cfg.defAcct)?Math.min(0,acctBalance(acctById(S.cfg.defAcct))):0;
  const livre=r2(P-contas-fat-coverT-metaAmt);const days=nextPayDays(who,kind)||daysToPayday();
  return {id:uid(),P,who:who||null,contas,fat,cover,coverT,defNeg,metaAmt,alloc,livre,days,done:false};
}

  try{(pl.cover||[]).forEach(c=>{if(S.cfg.defAcct&&acctById(c.acct)){acctMove(S.cfg.defAcct,-c.v,'Cobrir negativo');acctMove(c.acct,c.v,'Cobertura do negativo');}});

/* ======================= CARTÃO DE CRÉDITO ======================= */
const CARD_COLORS={roxo:['#5b2a86','#8a3ffc'],laranja:['#c2410c','#f59e0b'],preto:['#111827','#374151'],verde:['#14532d','#22c55e'],azul:['#1e3a8a','#3b82f6'],vermelho:['#7f1d1d','#ef4444'],dourado:['#7a5a12','#e8b84a']};
function clampDay(y,m,d){const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(d,last),12);}
function cardById(id){return S.cfg.cards.find(c=>c.id===id);}
/* Em que fatura cai uma compra feita em 'date' */
function dueFor(c,date){
  const y=date.getFullYear(),m=date.getMonth();
  const closeThis=clampDay(y,m,c.close);
  const cm=date.getDate()>=closeThis.getDate()?m+1:m;
  return c.due>c.close?clampDay(y,cm,c.due):clampDay(y,cm+1,c.due);
}
function dueDateOf(c,key){const [y,m]=key.split('-').map(Number);return clampDay(y,m-1,c.due);}
function closeDateOf(c,key){const [y,m]=key.split('-').map(Number);return clampDay(y,c.due>c.close?m-1:m-2,c.close);}
function fatItems(cid,key){return (S.months[key]?S.months[key].entries:[]).filter(e=>e.card===cid);}
function fatTotal(cid,key){return r2(fatItems(cid,key).reduce((a,e)=>a+e.v,0));}
function fatPaid(cid,key){return (S.cfg.cardPaid||{})[cid+'|'+key]||0;}
function fatStatus(c,key){
  const tot=fatTotal(c.id,key),paid=fatPaid(c.id,key),t=new Date();t.setHours(12,0,0,0);
  if(tot>0&&paid>=tot-0.005)return 'paga';
  if(t>dueDateOf(c,key))return tot>0?'vencida':'paga';
  if(t>=closeDateOf(c,key))return 'fechada';
  return 'aberta';
}
function cardKeys(cid){return Object.keys(S.months).filter(k=>S.months[k].entries.some(e=>e.card===cid)).sort();}
function usedLimit(c){return r2(cardKeys(c.id).reduce((a,k)=>a+Math.max(0,fatTotal(c.id,k)-fatPaid(c.id,k)),0));}
function openKey(c){return mk(dueFor(c,new Date()));}
function bestDayInfo(c){
  const t=new Date();const cl=clampDay(t.getFullYear(),t.getMonth(),c.close);
  const d=t.getDate()-cl.getDate();const due=dueFor(c,t);const days=Math.round((due-t)/DAY);
  return {isBest:d>=0&&d<=1,days,due};
}
function addCardBuy(o){
  const c=cardById(o.card);const date=new Date();if(o.dayOff)date.setDate(date.getDate()+o.dayOff);
  if(o.date){const [y,m,dd]=o.date.split('-').map(Number);date.setFullYear(y,m-1,dd);}
  const n=Math.max(1,Math.min(48,o.n||1));const total=r2(o.total);const per=Math.floor(total/n*100)/100;
  const first=dueFor(c,date);const fk=mk(first);const buy=uid();const ids=[];
  for(let i=0;i<n;i++){
    const k=shiftKey(fk,i);const due=dueDateOf(c,k);const v=i===n-1?r2(total-per*(n-1)):per;
    const en={id:uid(),t:'s',v,cat:o.cat,desc:o.desc+(n>1?` (${i+1}/${n})`:''),ts:due.getTime(),src:'cartao',card:c.id,buy,i:i+1,n,total,bt:date.getTime()};
    if(S.cfg.couple)en.who=o.who||ACTIVE;
    month(k).entries.push(en);month(k).upd=Date.now();dirty.add('m-'+k);ids.push({k,id:en.id});
  }
  persist();S.lastAdd=ids[0];
  return {buy,fk,n,per,last:shiftKey(fk,n-1),total};
}
function removeBuy(buy){
  for(const k in S.months){const m=S.months[k];const before=m.entries.length;m.entries=m.entries.filter(e=>e.buy!==buy);if(m.entries.length!==before){m.upd=Date.now();dirty.add('m-'+k);}}
  persist();
}
function payFat(c,key,v){if(S.cfg.defAcct)acctMove(S.cfg.defAcct,-v,'Fatura '+c.name);S.cfg.cardPaid=S.cfg.cardPaid||{};const k=c.id+'|'+key;S.cfg.cardPaid[k]=r2((S.cfg.cardPaid[k]||0)+v);touchCfg();}
function cardTodayTotal(){const t=new Date().toDateString();let s=0;for(const k in S.months)S.months[k].entries.forEach(e=>{if(e.card&&e.i===1&&new Date(e.bt).toDateString()===t)s+=e.total;});return r2(s);}
function keyLabel(k){const [y,m]=k.split('-');return MESES[+m-1].slice(0,3)+'/'+y.slice(2);}
/* Simula como ficam as próximas faturas com uma compra parcelada */
function simulate(c,total,n){
  const fk=mk(dueFor(c,new Date()));const per=r2(total/n);const rows=[];
  const horizon=Math.max(n,3);
  for(let i=0;i<Math.min(horizon,12);i++){const k=shiftKey(fk,i);const cur=fatTotal(c.id,k);const extra=i<n?per:0;rows.push({k,cur,extra,tot:r2(cur+extra)});}
  const inc=stats(mk(new Date())).inc;const avail=r2(c.limit-usedLimit(c));
  const worst=rows.reduce((a,r)=>r.tot>a.tot?r:a,rows[0]);
  return {rows,per,avail,fits:total<=avail+0.005,inc,worst,pctWorst:inc?worst.tot/inc*100:null};
}
function simText(c,total,n){
  const s=simulate(c,total,n);
  let t=`🧮 Simulação: ${brl(total)} em ${n}x de ${brl(s.per)} no ${esc(c.name)}\n`;
  t+=s.rows.slice(0,Math.min(6,s.rows.length)).map(r=>`${keyLabel(r.k)}: ${brl(r.cur)}${r.extra?` + ${brl(r.extra)} = <b>${brl(r.tot)}</b>`:''}`).join('\n');
  t+=`\n\nLimite disponível: ${brl(s.avail)} ${s.fits?'✅':'❌ não cabe'}`;
  if(s.pctWorst!=null){t+=`\nPior fatura: ${keyLabel(s.worst.k)} com ${brl(s.worst.tot)} (${s.pctWorst.toFixed(0)}% da renda) `+(s.pctWorst>40?'🔴 pesado demais':s.pctWorst>25?'🟠 aperta':'🟢 tranquilo');}
  const bd=bestDayInfo(c);if(!bd.isBest)t+=`\n<small>Dica: comprando a partir do dia ${c.close} (fechamento), a 1ª parcela só vence ~40 dias depois.</small>`;
  return t;
}
function parseParc(raw){
  let s=' '+raw.toLowerCase()+' ';let n=null,per=null;
  let m=s.match(/(\d{1,2})\s*x\s*de\s*(?:r\$\s*)?(\d[\d.,]*)/);
  if(m){n=+m[1];per=parseNumTok(m[2]);s=s.replace(m[0],' ');}
  else{m=s.match(/(?:parcelad[oa]s?\s*em\s*|em\s*)?(\d{1,2})\s*(?:x\b|vezes|parcelas)/);if(m){n=+m[1];s=s.replace(m[0],' ');}}
  if(/[aà] vista/.test(s)){n=1;s=s.replace(/[aà] vista/,' ');}
  return {n,per,clean:s.trim()};
}
function detectCard(n){
  if(/\b(debito|pix|dinheiro vivo)\b/.test(n))return null;
  const cs=S.cfg.cards;
  const credit=/\b(cartao|credito|parcel|\d{1,2}\s*x\b|\d{1,2} vezes)/.test(n);
  const byName=cs.find(c=>hasWord(n,norm(c.name)));if(byName&&(credit||!findAcct(n)))return {card:byName};
  if(byName&&!credit)return null;
  if(/\b(cartao|credito|no credito|parcelad|\d{1,2}\s*x\b|\d{1,2} vezes)/.test(n)){if(!cs.length)return {none:true};return {card:cs[0],guessed:cs.length>1};}
  return null;
}
function cardReply(raw,n){
  // novo cartão
  if(/^(reis,? )?(novo cartao|cadastra (o |meu )?cartao|adiciona (o |meu )?cartao|cartao novo)\b/.test(n)){
    const lim=n.match(/limite (?:de )?(?:r\$ ?)?(\d[\d.,]*k?)/);const fe=n.match(/fecha(?:mento)?(?: no| dia)? (?:dia )?(\d{1,2})/);const ve=n.match(/vence(?:imento)?(?: no| dia)? (?:dia )?(\d{1,2})/);

    return `✅ Fatura de ${keyLabel(key)} do ${esc(c.name)} paga: ${brl(v)}.\nLimite disponível agora: ${brl(c.limit-usedLimit(c))}.`;}
  // perguntas sobre cartão
  if(/(fatura|limite|cartao|cartoes)/.test(n)&&(/\?/.test(raw)||/^(reis,? )?(quanto|como|qual|mostra|ver|meu|minha|minhas|meus)/.test(n)||/^(fatura|faturas|limite|cartoes?)$/.test(n))&&!extractAmount(tokens(raw).n)){
    if(!S.cfg.cards.length)return 'Nenhum cartão ainda. Cadastre assim: "<b>novo cartão Nubank limite 5000 fecha dia 3 vence dia 10</b>".';
    return S.cfg.cards.map(c=>{const ok=openKey(c);const used=usedLimit(c);const bd=bestDayInfo(c);
      const closed=cardKeys(c.id).filter(k=>['fechada','vencida'].includes(fatStatus(c,k)));
      return `💳 <b>${esc(c.name)}</b>\n`+closed.map(k=>`Fatura ${keyLabel(k)} (${fatStatus(c,k)}, vence ${pad(c.due)}/${k.split('-')[1]}): <b>${brl(fatTotal(c.id,k)-fatPaid(c.id,k))}</b>`).join('\n')+(closed.length?'\n':'')+
        `Fatura aberta ${keyLabel(ok)}: ${brl(fatTotal(c.id,ok))} · fecha dia ${c.close}\nLimite: ${brl(c.limit-used)} livres de ${brl(c.limit)} (${(used/c.limit*100).toFixed(0)}% usado)`+(bd.isBest?'\n⭐ Hoje é o melhor dia de compra neste cartão.':'');}).join('\n\n');}

  let total=null;const amt=extractAmount(tokens(cleanRaw).n);

  if(!total)return 'Quanto foi? Ex.: "<b>tênis 600 em 3x no '+esc(c.name.toLowerCase())+'</b>".';
  const nP=pp.n||1;

  if(total>avail+0.005)msg+=`\n⚠️ Essa compra passou do limite disponível (${brl(avail)}). Confere no app do banco.`;

  const s=stats(r.fk);if(s.inc&&nP>1&&fatTotal(c.id,r.fk)/s.inc>0.3)msg+=`\n🟠 A fatura de ${keyLabel(r.fk)} já passa de 30% da renda.`;
  return msg;
}

// Tabelas 2026: INSS (teto R$ 8.475,55) e IRRF com a redução da Lei 15.270/2025
const INSS26=[[1621.00,0.075],[2902.84,0.09],[4354.27,0.12],[8475.55,0.14]];
const IRRF=[[2428.80,0,0],[2826.65,0.075,182.16],[3751.05,0.15,394.16],[4664.68,0.225,675.49],[Infinity,0.275,908.73]];
const DEP=189.59;
function calcINSS(b){let t=0,prev=0;for(const [lim,a] of INSS26){if(b>prev){t+=(Math.min(b,lim)-prev)*a;}prev=lim;}return r2(t);}
function calcIR(bruto,inss,deps){
  const base=Math.max(0,bruto-inss-(deps||0)*DEP);let ir=0;
  for(const [lim,a,d] of IRRF){if(base<=lim){ir=base*a-d;break;}}
  ir=Math.max(0,ir);let red=0;
  if(bruto<=5000)red=Math.min(ir,312.89);else if(bruto<=7350)red=Math.max(0,978.62-0.133145*bruto);
  return {ir:r2(Math.max(0,ir-red)),red:r2(Math.min(red,ir)),base:r2(base)};
}
function salOf(pid){S.cfg.salary=S.cfg.salary||{};return S.cfg.salary[pid]||null;}
function calcSalary(s){
  if(!s||!s.bruto)return null;
  const inss=calcINSS(s.bruto);const irx=calcIR(s.bruto,inss,s.deps);
  const outros=(s.desc||[]).map(d=>({...d,val:r2(d.pct?s.bruto*d.v/100:d.v)}));
  const outT=r2(outros.reduce((a,d)=>a+d.val,0));
  const liq=r2(s.bruto-inss-irx.ir-outT);
  const vale=r2(Math.min(liq,(s.valeBase==='liquido'?liq:s.bruto)*(s.valePct??40)/100));
  return {inss,ir:irx.ir,red:irx.red,outros,outT,liq,vale,pag:r2(liq-vale)};
}
function bizDayN(y,m,n){let d=new Date(y,m,1,12),c=0;while(true){const w=d.getDay();if(w&&w<6){c++;if(c===n)return d;}d.setDate(d.getDate()+1);}}
function valeDateOf(y,m,day){let d=clampDay(y,m,day);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);return d;}
function nextReceipts(s,from){
  from=from||new Date();from=new Date(from.getFullYear(),from.getMonth(),from.getDate(),12);const out=[];
  for(let i=-1;i<3;i++){const y=from.getFullYear(),m=from.getMonth()+i;
    const p=bizDayN(new Date(y,m,1).getFullYear(),new Date(y,m,1).getMonth(),s.payBiz||5);if(p>=from)out.push({k:'pag',d:p});
    if((s.valePct??40)>0){const v=valeDateOf(new Date(y,m,1).getFullYear(),new Date(y,m,1).getMonth(),s.valeDay||20);if(v>=from)out.push({k:'vale',d:v});}}
  return out.sort((a,b)=>a.d-b.d);
}

const BANKS={itau:'Itaú',nubank:'Nubank',inter:'Inter',bradesco:'Bradesco',santander:'Santander',caixa:'Caixa','banco do brasil':'Banco do Brasil',bb:'Banco do Brasil',c6:'C6 Bank',picpay:'PicPay','mercado pago':'Mercado Pago',pagbank:'PagBank',neon:'Neon',next:'Next',sicoob:'Sicoob',sicredi:'Sicredi',original:'Original',btg:'BTG',xp:'XP',will:'Will Bank',sofisa:'Sofisa','99pay':'99Pay',recargapay:'RecargaPay'};
function acctById(id){return (S.cfg.accts||[]).find(a=>a.id===id);}
function acctBalance(a){
  let b=a.base;const t0=a.baseTs||0;
  for(const k in S.months)S.months[k].entries.forEach(e=>{if(e.acct!==a.id)return;const t=e.bt||e.ts;if(t<t0)return;
    if(e.t==='e')b+=e.v;else b-=e.v;});
  (S.cfg.acctMoves||[]).forEach(m=>{if(m.acct===a.id&&m.ts>=t0)b+=m.v;});
  return r2(b);
}
function findAcct(n){const as=S.cfg.accts||[];return as.find(a=>hasWord(n,norm(a.name)))||null;}
function bankFromText(n){for(const k of Object.keys(BANKS).sort((a,b)=>b.length-a.length))if(hasWord(n,k))return BANKS[k];return null;}
function upsertAcct(name,bal){
  S.cfg.accts=S.cfg.accts||[];let a=S.cfg.accts.find(x=>norm(x.name)===norm(name));
  if(!a){a={id:uid(),name,base:bal,baseTs:Date.now(),limit:0};S.cfg.accts.push(a);if(!S.cfg.defAcct&&S.cfg.accts.length===1)S.cfg.defAcct=null;}
  else{a.base=bal;a.baseTs=Date.now();}
  touchCfg();return a;
}
function acctMove(acct,v,desc){S.cfg.acctMoves=S.cfg.acctMoves||[];S.cfg.acctMoves.push({id:uid(),acct,v:r2(v),ts:Date.now(),desc});if(S.cfg.acctMoves.length>400)S.cfg.acctMoves.shift();touchCfg();}
function acctReply(raw,n){
  // transferência
  let m=n.match(/^(?:reis,? )?transferi\s+(?:r\$\s*)?(\d[\d.,]*k?)(?:\s*reais)?\s+d[oa]\s+(.+?)\s+(?:pro|pra|para o|para a|para)\s+(.+)$/);
  if(m){const v=parseNumTok(m[1]);const a=findAcct(m[2]),b=findAcct(m[3]);
    if(!v||!a||!b)return 'Não achei as contas. Cadastre na aba 💳 Contas ou diga "saldo do itaú 500".';
    acctMove(a.id,-v,'Transferência pra '+b.name);acctMove(b.id,v,'Transferência do '+a.name);

  <div class="card"><h3>🎯 Meta de poupança · ${c.meta}%</h3>${meta}${s.inc?`<div class="bar" style="margin-top:12px"><div class="top"><span>Guardado no mês</span><span><b>${brl(s.guard)}</b> <span class="mut">de ${brl(s.metaV)}</span></span></div><div class="track"><div class="fill" style="width:${Math.min(100,s.metaV?s.guard/s.metaV*100:0)}%;background:var(--gold)"></div></div></div>`:''}</div>
  ${c.goals.length?`<div class="card"><h3>🎯 Metas</h3>${c.goals.slice(0,4).map(g=>{const pct=g.target?Math.min(100,g.saved/g.target*100):0;return `<div class="bar"><div class="top"><span>${goalEmoji(g.name)} ${esc(g.name)} ${c.couple&&g.owner==='casal'?'⭐':''}</span><span><b>${pct.toFixed(0)}%</b></span></div><div class="track"><div class="fill" style="width:${pct}%;background:var(--gold)"></div></div></div>`}).join('')}</div>`:''}
  ${cardsPainel()}
  ${c.boxes.length?(()=>{const t=totalsGuard();return `<div class="card"><h3>🐷 Guardado</h3><div class="big gold" style="font-size:26px">${brl(t.n)}</div><div class="mut" style="font-size:13px">rendendo ~${brl(t.mes)} por mês em ${c.boxes.length} caixinha${c.boxes.length>1?'s':''}</div></div>`})():''}
  ${coupleCard(viewMonth)}
  <div class="card"><h3>Peso de cada gasto ${s.inc?'na renda':'nos gastos'}</h3>
   ${rows.length?rows.map(([k,v])=>{const pct=base?v/base*100:0,ref=CATS[k].ref;const cls=!s.inc?'':pct>ref*1.3?'bad':pct>ref?'warn':'';
     return `<div class="bar"><div class="top"><span>${CATS[k].e} ${CATS[k].n}</span><span><b>${brl(v)}</b> <span class="mut">${pct.toFixed(0)}%</span></span></div>

     +(s.inc?'<div class="mut" style="font-size:12px;margin-top:8px">A marquinha é a referência de quanto cada categoria costuma pesar numa renda equilibrada.</div>':'')
     :'<div class="empty">Sem gastos neste mês ainda.</div>'}
  </div>
  <div class="card"><h3>Onde corrigir</h3>${insights(viewMonth).map(x=>`<div class="ins"><i>${x.i}</i><div>${esc(x.t)}</div></div>`).join('')}</div>
  <div class="card"><h3>Cotações</h3>
   <div class="rate"><span>💵 Dólar</span><b>${c.usd?brl(c.usd):'—'}</b></div>

   <div class="mut" style="font-size:12px;margin:6px 0 10px">${c.ratesAt?(c.ratesSrc==='online'?'Online':'Informada manualmente')+' em '+new Date(c.ratesAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'Sem cotação ainda.'}</div>
   <div class="grid2"><button class="btn sec sm" id="rtUp">↻ Atualizar online</button><button class="btn sec sm" id="rtMan">✎ Informar</button></div>

  $('rtMan').onclick=()=>modal('Informar cotação',`<div class="f"><label>Dólar (R$)</label><input id="mUsd" inputmode="decimal" value="${c.usd?String(c.usd).replace('.',','):''}"></div><div class="f"><label>Bitcoin (R$)</label><input id="mBtc" inputmode="decimal" value="${c.btc?String(Math.round(c.btc)):''}"></div>`,
    [{l:'Cancelar',c:'sec'},{l:'Salvar',f:()=>{const u=parseNumTok($('mUsd').value.trim()),b=parseNumTok($('mBtc').value.trim());if(u)S.cfg.usd=u;if(b)S.cfg.btc=b;if(u||b){S.cfg.ratesAt=Date.now();S.cfg.ratesSrc='manual';touchCfg();renderAll();}}}]);

function catOptions(t,sel){const src=t==='e'?INC:CATS;return Object.keys(src).map(k=>`<option value="${k}" ${k===sel?'selected':''}>${src[k].e} ${src[k].n}</option>`).join('');}
let formT='s';
let lancMode='30';
function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x;}
function entryDate(e){return new Date(e.card?e.bt:e.ts);}
function lancRow(e,k,thirty){
  const cat=e.t==='g'?{e:e.goal?'🎯':'🐷',n:e.v<0?(e.goal?'Tirado da meta':'Resgate de caixinha'):(e.goal?'Meta':'Guardado')}:e.t==='e'?INC[e.cat]||INC.outra:CATS[e.cat]||CATS.outros;
  const isBuy=!!e.buy;const v=thirty&&isBuy?e.total:e.v;
  const desc=thirty&&isBuy?(e.desc||'').replace(/\s*\(\d+\/\d+\)$/,'')+(e.n>1?` · ${e.n}x`:''):e.desc;
  const ac=e.acct&&acctById(e.acct);
  return `<div class="row" data-id="${e.id}" data-k="${k}" ${isBuy?`data-buy="${e.buy}"`:''}><div class="ic">${cat.e}</div><div class="tx"><b>${esc(desc||cat.n)}</b><small>${cat.n}${e.src==='conta'?' · conta fixa':''}${e.card&&cardById(e.card)?' · 💳 '+esc(cardById(e.card).name):''}${ac?' · 🏦 '+esc(ac.name):''} ${whoTag(e.who)}</small></div><div class="val ${e.t==='e'?'pos':e.t==='g'?'gold':''}">${e.t==='e'?'+':e.t==='g'?(e.v<0?'↩':'→'):'−'} ${brl(Math.abs(v))}</div><button class="x" data-del="${e.id}" data-k="${k}" aria-label="Apagar">✕</button></div>`;
}
function renderLanc(){
  const today=new Date();
  const defDate=(lancMode==='30'||viewMonth===mk(today))?`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`:viewMonth+'-01';
  const payOpts=formT==='s'?acctOptions('',true):acctOptions('',false);
  let html=`<div class="seg" id="lmode"><button data-lm="30" class="${lancMode==='30'?'on':''}">Últimos 30 dias</button><button data-lm="m" class="${lancMode==='m'?'on':''}">Por mês</button></div>`;
  if(lancMode==='m')html+=monthNav();
  html+=`<div class="card"><details id="addBox"><summary>＋ Lançar manualmente</summary><div style="margin-top:12px">
    <div class="seg"><button data-t="s" class="${formT==='s'?'on':''}">Saída</button><button data-t="e" class="${formT==='e'?'on':''}">Entrada</button></div>
    <div class="grid2"><div class="f"><label>Valor (R$)</label><input id="fV" inputmode="decimal" placeholder="0,00"></div><div class="f"><label>Data</label><input id="fD" type="date" value="${defDate}"></div></div>
    <div class="f"><label>Categoria</label><select id="fC">${catOptions(formT)}</select></div>
    ${((S.cfg.accts||[]).length||(formT==='s'&&S.cfg.cards.length))?`<div class="grid2"><div class="f"><label>${formT==='s'?'Pagou com':'Recebeu em'}</label><select id="fPay">${payOpts}</select></div>${formT==='s'?`<div class="f"><label>Parcelas (cartão)</label><input id="fN" inputmode="numeric" value="1"></div>`:''}</div>`:''}
    <div class="f"><label>Descrição</label><input id="fDe" placeholder="Opcional"></div>
    <button class="btn" id="fAdd" style="width:100%">Lançar</button></div></details></div>`;
  // junta os lançamentos
  const items=[];
  if(lancMode==='30'){const from=new Date(today.getFullYear(),today.getMonth(),today.getDate()-29).getTime(),to=new Date(today.getFullYear(),today.getMonth(),today.getDate()+1).getTime();
    for(const k in S.months)S.months[k].entries.forEach(e=>{if(e.card&&e.i!==1)return;const d=entryDate(e).getTime();if(d>=from&&d<to)items.push({e,k,d});});}
  else{const m=month(viewMonth);m.entries.forEach(e=>items.push({e,k:viewMonth,d:e.ts}));}
  items.sort((a,b)=>b.d-a.d);
  if(!items.length)html+=`<div class="empty">Nenhum lançamento ${lancMode==='30'?'nos últimos 30 dias':'em '+mLabel(viewMonth)}.</div>`;
  else{
    const weeks=[];items.forEach(it=>{const ws=weekStart(new Date(it.d)).getTime();let w=weeks.find(x=>x.ws===ws);if(!w){w={ws,list:[]};weeks.push(w);}w.list.push(it);});
    const curWs=weekStart(today).getTime();
    html+='<div class="card" style="padding:4px 14px">';
    weeks.forEach((w,wi)=>{
      const a=new Date(w.ws),b=new Date(w.ws+6*DAY);
      let out=0,inc=0,g=0;w.list.forEach(({e})=>{const v=lancMode==='30'&&e.buy?e.total:e.v;if(e.t==='e')inc+=v;else if(e.t==='g')g+=v;else out+=v;});
      const lbl=a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MESES[a.getMonth()].slice(0,3)}`:`${a.getDate()} ${MESES[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MESES[b.getMonth()].slice(0,3)}`;
      const open=(lancMode==='30'?w.ws===curWs:wi===0)||renderLanc.openW===w.ws;
      html+=`<details class="wk" data-ws="${w.ws}" ${open?'open':''}><summary><span><b>${w.ws===curWs?'Esta semana':'Semana '+lbl}</b><br><small class="mut">${w.ws===curWs?lbl+' · ':''}${w.list.length} lançamento${w.list.length>1?'s':''}</small></span><span style="text-align:right;font-size:13px">${out?`<span class="neg">−${brl(out)}</span>`:''}${inc?`<br><span class="pos">+${brl(inc)}</span>`:''}${g?`<br><span class="gold">🐷 ${brl(g)}</span>`:''}</span></summary><div style="padding-bottom:6px">`;
      let lastDay='';w.list.forEach(({e,k,d})=>{const dl=new Date(d).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});if(dl!==lastDay){html+=`<div class="day">${dl}</div>`;lastDay=dl;}html+=lancRow(e,k,lancMode==='30');});
      html+='</div></details>';});
    html+='</div>';
    if(lancMode==='30')html+='<div class="mut" style="font-size:12px;text-align:center">Compras parceladas aparecem pelo valor total no dia da compra. As parcelas ficam em "Por mês".</div>';
  }
  $('v-lanc').innerHTML=html;
  $('lmode').querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>{lancMode=b.dataset.lm;renderLanc();});
  $('v-lanc').querySelectorAll('details.wk').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)renderLanc.openW=+d.dataset.ws;}));
  const box=$('addBox');if(renderLanc.open)box.open=true;box.addEventListener('toggle',()=>renderLanc.open=box.open);
  $('v-lanc').querySelectorAll('.seg button[data-t]').forEach(b=>b.onclick=()=>{formT=b.dataset.t;renderLanc.open=true;renderLanc();});
  $('fAdd').onclick=()=>{const v=parseNumTok($('fV').value.trim());if(!v){toast('Informe um valor');return;}
    const pay=$('fPay')?$('fPay').value:'';
    if(formT==='s'&&pay.startsWith('c:')){const r=addCardBuy({card:pay.slice(2),total:v,n:parseInt($('fN').value)||1,cat:$('fC').value,desc:$('fDe').value.trim()||CATS[$('fC').value].n,date:$('fD').value});toast(`💳 Lançado na fatura de ${keyLabel(r.fk)}`);renderAll();return;}
    const en=addEntry({t:formT,v,cat:$('fC').value,desc:$('fDe').value.trim(),date:$('fD').value,src:'manual',acct:pay.startsWith('a:')?pay.slice(2):undefined});
    if(en.t==='e'&&en.cat==='salario'&&mk(new Date(en.ts))===mk(new Date())){pushMsg('reis',triggerPayday(en));renderAll();go('chat');return;}
    toast('Lançado ✅');renderAll();};
  $('v-lanc').querySelectorAll('[data-del]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const id=b.dataset.del,k=b.dataset.k;const e=month(k).entries.find(x=>x.id===id);if(!e)return;
    modal('Apagar lançamento?',`${esc(e.desc)} — ${brl(e.buy?e.total:e.v)}${e.buy&&e.n>1?`<br><small class="mut">Apaga a compra e as ${e.n} parcelas.</small>`:''}`,[{l:'Cancelar',c:'sec'},{l:'Apagar',c:'dan',f:()=>{removeEntry(k,id);renderAll();toast('Apagado');}}]);});
  $('v-lanc').querySelectorAll('.row').forEach(r=>r.onclick=()=>{
    if(r.dataset.buy){editBuy(r.dataset.buy);return;}
    const k=r.dataset.k;const e=month(k).entries.find(x=>x.id===r.dataset.id);if(!e||e.t==='g')return;
    modal('Editar lançamento',`<div class="grid2"><div class="f"><label>Valor (R$)</label><input id="eV" inputmode="decimal" value="${String(e.v).replace('.',',')}"></div><div class="f"><label>Categoria</label><select id="eC">${catOptions(e.t,e.cat)}</select></div></div><div class="f"><label>Descrição</label><input id="eD" value="${esc(e.desc)}"></div>
      ${(S.cfg.accts||[]).length?`<div class="f"><label>Conta</label><select id="eA">${acctOptions(e.acct?'a:'+e.acct:'',false)}</select></div>`:''}
      ${e.t==='s'?`<label style="display:flex;gap:8px;align-items:center;font-size:13px" class="mut"><input type="checkbox" id="eL" checked style="width:auto"> Lembrar essa categoria para "${esc((e.desc||'').toLowerCase())}"</label>`:''}`,
      [{l:'Cancelar',c:'sec'},{l:'Salvar',f:()=>{const v=parseNumTok($('eV').value.trim());if(v)e.v=v;const nc=$('eC').value;
        if(e.t==='s'&&$('eL')?.checked&&e.desc&&nc!==e.cat){const w=norm(e.desc);if(w.length<=30){S.cfg.learned[w]=nc;touchCfg();}}
        if($('eA')){const a=$('eA').value;if(a.startsWith('a:'))e.acct=a.slice(2);else delete e.acct;}
        e.cat=nc;e.desc=$('eD').value.trim();touchMonth(k);renderAll();toast('Salvo');}}]);});
}


function renderContas(){
  const k=mk(new Date());const m=month(k);const today=new Date().getDate();
  const bills=[...S.cfg.bills].sort((a,b)=>a.dia-b.dia);const tot=bills.reduce((s,b)=>s+b.v,0),paid=bills.filter(b=>m.paid[b.id]).reduce((s,b)=>s+b.v,0);
  let html=acctsHTML()+cardsHTML()+`<div class="card"><h3>Contas fixas · ${MESES[new Date().getMonth()]}</h3><div class="trio" style="margin-top:0"><div><small>Total</small><b>${brl(tot)}</b></div><div><small>Pagas</small><b class="pos">${brl(paid)}</b></div><div><small>Faltam</small><b class="gold">${brl(tot-paid)}</b></div></div></div>`;
  html+='<div class="card">';
  if(!bills.length)html+='<div class="empty">Nenhuma conta fixa ainda.<br>Cadastre abaixo ou diga ao Reis: "conta fixa internet 100 dia 15".</div>';
  bills.forEach(b=>{const isPaid=!!m.paid[b.id];const dd=b.dia-today;
    const tag=isPaid?'<span class="tag ok">paga</span>':dd<0?'<span class="tag ba">vencida</span>':dd<=3?`<span class="tag wa">${dd===0?'vence hoje':dd===1?'amanhã':'em '+dd+' dias'}</span>`:`<span class="tag" style="color:var(--mut)">dia ${b.dia}</span>`;
    html+=`<div class="row"><div class="ic">${(CATS[b.cat]||CATS.casa).e}</div><div class="tx"><b>${esc(b.name)}</b><small>${brl(b.v)} · todo dia ${b.dia}</small></div>${tag}
      ${isPaid?`<button class="btn sec sm" data-unpay="${b.id}">Desfazer</button>`:`<button class="btn sm" data-pay="${b.id}">Pagar</button>`}<button class="x" data-rmb="${b.id}">✕</button></div>`;});
  html+=`</div><div class="card"><h3>Nova conta fixa</h3><div class="f"><label>Nome</label><input id="bN" placeholder="Ex.: Internet"></div>
    <div class="grid2"><div class="f"><label>Valor (R$)</label><input id="bV" inputmode="decimal" placeholder="0,00"></div><div class="f"><label>Vence dia</label><input id="bD" inputmode="numeric" placeholder="10"></div></div>
    <div class="f"><label>Categoria</label><select id="bC">${catOptions('s','casa')}</select></div><button class="btn" id="bAdd" style="width:100%">Adicionar</button></div>`;
  $('v-contas').innerHTML=html;bindCards($('v-contas'));bindAccts($('v-contas'));
  $('bAdd').onclick=()=>{const name=$('bN').value.trim(),v=parseNumTok($('bV').value.trim()),d=parseInt($('bD').value);
    if(!name||!v||!(d>=1&&d<=31)){toast('Preencha nome, valor e dia (1–31)');return;}
    S.cfg.bills.push({id:uid(),name,v,dia:d,cat:$('bC').value});touchCfg();renderAll();toast('Conta adicionada');};
  $('v-contas').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const bill=S.cfg.bills.find(x=>x.id===b.dataset.pay);
    modal('Pagar '+esc(bill.name),`<div class="f"><label>Valor pago (R$)</label><input id="pV" inputmode="decimal" value="${String(bill.v).replace('.',',')}"></div><div class="mut" style="font-size:13px">Vai entrar como saída de hoje.</div>`,
      [{l:'Cancelar',c:'sec'},{l:'Confirmar',f:()=>{payBill(bill,parseNumTok($('pV').value.trim())||bill.v);renderAll();toast('Conta paga ✅');}}]);});
  $('v-contas').querySelectorAll('[data-unpay]').forEach(b=>b.onclick=()=>{const id=m.paid[b.dataset.unpay];if(id)removeEntry(k,id);delete m.paid[b.dataset.unpay];touchMonth(k);renderAll();});
  $('v-contas').querySelectorAll('[data-rmb]').forEach(b=>b.onclick=()=>{const bill=S.cfg.bills.find(x=>x.id===b.dataset.rmb);
    modal('Remover conta fixa?',`${esc(bill.name)} — ${brl(bill.v)}. Os pagamentos já lançados continuam.`,[{l:'Cancelar',c:'sec'},{l:'Remover',c:'dan',f:()=>{S.cfg.bills=S.cfg.bills.filter(x=>x.id!==bill.id);touchCfg();renderAll();}}]);});
}

   <div class="f" style="margin-top:12px"><label>Restaurar backup (arquivo .json ou colar o texto)</label><input type="file" id="bkF" accept=".json,application/json"><textarea id="bkT" rows="3" placeholder="Cole aqui o backup copiado"></textarea></div>
   <button class="btn sec sm" id="bkR">Restaurar</button>
   <div style="margin-top:14px"><button class="btn dan sm" id="wipe">Apagar todos os dados</button></div>
  </div>
  <div class="foot"><img class="hero" src="${COIN_GIF}" alt="Moeda ME.REI$" style="width:72px;height:72px"><b class="gold">ME.REI$</b> · Alpha 00.10<br>por <b>@el.rafs</b><br>com colaboração do Claude, IA da Anthropic</div>`;
  if($('instBtn'))$('instBtn').onclick=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice;}catch(e){}installEvt=null;renderAjustes();};
  $('updBtn').onclick=hardUpdate;$('whatsNew').onclick=()=>{pushMsg('reis',CHANGELOG);go('chat');};bindSalary($('v-ajustes'));
  $('cpS').onclick=()=>{c.couple=$('cpOn').checked;c.people[0].name=$('cp1').value.trim()||'Eu';c.people[1].name=$('cp2').value.trim()||'Parceiro(a)';touchCfg();renderAll();toast(c.couple?'Modo casal ligado 💑':'Salvo');};
  $('aMs').onclick=()=>{const v=parseInt($('aM').value);if(!(v>=0&&v<=90)){toast('Use de 0 a 90%');return;}c.meta=v;const pd=parseInt($('aP').value);if(pd>=1&&pd<=31)c.payday=pd;touchCfg();toast('Salvo');renderAll();};
  $('v-ajustes').querySelectorAll('[data-unl]').forEach(b=>b.onclick=()=>{delete c.learned[b.dataset.unl];touchCfg();renderAll();});
  $('bkDl').onclick=async()=>{const name='mereis-backup-'+new Date().toISOString().slice(0,10)+'.json',data=backupJSON();
    if(dl){try{await dl.save({filename:name,data});toast('Backup salvo');}catch(e){toast('Download cancelado');}return;}
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click();toast('Backup baixado');}catch(e){toast('Use "Copiar backup"');}};
  $('bkCp').onclick=()=>{navigator.clipboard.writeText(backupJSON()).then(()=>toast('Backup copiado'),()=>toast('Não deu pra copiar aqui'));};
  $('bkF').onchange=()=>{const f=$('bkF').files[0];if(!f)return;f.text().then(t=>$('bkT').value=t);};
  $('bkR').onclick=()=>{let p;try{p=JSON.parse($('bkT').value);}catch(e){toast('Backup inválido');return;}
    if(!p||!p.cfg||!p.months){toast('Backup inválido');return;}
    modal('Restaurar backup?','Isso substitui todos os dados atuais pelos do backup.',[{l:'Cancelar',c:'sec'},{l:'Restaurar',c:'dan',f:()=>{
      S.cfg=Object.assign(blank().cfg,p.cfg);S.months=p.months;const now=Date.now();S.cfg.upd=now;dirty.add('config');
      for(const k in S.months){S.months[k].upd=now;dirty.add('m-'+k);}persist();renderAll();toast('Backup restaurado');}}]);};
  $('wipe').onclick=()=>modal('Apagar tudo?','Todos os lançamentos, contas e ajustes serão apagados. Faça um backup antes se quiser guardar.',[{l:'Cancelar',c:'sec'},{l:'Apagar tudo',c:'dan',f:async()=>{
      const keys=['config',...Object.keys(S.months).map(k=>'m-'+k)];S=blank();saveLocal();dirty.clear();
      if(col)for(const k of keys){try{await col.doc(k).delete();}catch(e){}}renderAll();renderChat();toast('Dados apagados');}}]);
}
function renderAll(chatOnly){
  if(curView==='painel')renderPainel();else if(curView==='lanc')renderLanc();else if(curView==='contas')renderContas();else if(curView==='guard')renderGuard();else if(curView==='ajustes')renderAjustes();
  if(!chatOnly)renderChat();setSync();
showChangelogIfNew();
}

/* ======================= APP INSTALÁVEL ======================= */
const STANDALONE_HOST=!window.claude&&location.protocol==='https:';
let installEvt=null;
if(STANDALONE_HOST&&'serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(curView==='ajustes')renderAjustes();});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('App instalado! 👑',true);});
/* ======================= INÍCIO ======================= */
renderChat();setSync();
if(!S.cfg.ratesAt||Date.now()-S.cfg.ratesAt>30*60*1000)fetchRates(false);
if(S.cfg.bcSrc!=='manual'&&(!S.cfg.bcAt||Date.now()-S.cfg.bcAt>6*3600*1000))fetchBC().then(ok=>{if(ok)renderAll();});
initCloud();
if(window.claude&&typeof claude.use==='function'){
  claude.use('dictation').then(d=>{if(!d)return;dict=d;$('mic').style.display='';
    d.onFinal(({text})=>{$('inp').value=($('inp').value+' '+text).trim();});
    d.onPartial(({text})=>{$('inp').placeholder=text||'Ouvindo…';});
    d.onState(({state})=>{const on=state==='listening';micState(on);if(!on&&fromVoice){fromVoice=false;const v=$('inp').value.trim();if(v){$('inp').value='';send(v);}}});
  }).catch(()=>{});
  claude.use('downloads').then(d=>{dl=d;}).catch(()=>{});
}
</script>
</body>
